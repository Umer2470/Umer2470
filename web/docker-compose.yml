services:
  choudhury-pos-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: choudhury-pos-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - DB_PATH=/data/pos_central.db
      - JWT_SECRET=choudhury-pos-permanent-prod-secret-change-in-production
      - PUBLIC_BASE_URL=https://pos.yourdomain.com
    volumes:
      - pos_data:/data
      - pos_downloads:/app/public/downloads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pos_data:
    driver: local
  pos_downloads:
    driver: local
