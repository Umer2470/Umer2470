version: '3.8'

services:
  choudhury-pos-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: choudhury-pos-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_PATH=/app/data/pos_central.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env or environment}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./public/downloads:/app/public/downloads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
