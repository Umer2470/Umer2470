name: Android CI / CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Android Artifacts
    # Warning 3 Fix: Pin explicit LTS runner (ubuntu-24.04) to prevent breakage during ubuntu-latest migration
    runs-on: ubuntu-24.04

    steps:
      # Warning 2 Fix: Latest stable checkout targeting Node.js 24 runtime
      - name: Checkout Code Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      # Warning 1 & 2 Fix: Upgrade setup-java@v4 to setup-java@v5 (Node 24 compliant)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Warning 2 Fix: setup-gradle with Node 24 support and smart build caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.3.0

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      # Build Step 1: Assemble Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug

      # Build Step 2: Assemble Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || gradle assembleRelease

      # Build Step 3: Bundle Release AAB
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace || gradle bundleRelease

      # Warning 2 Fix: Latest stable upload-artifact@v4.6.1 (Node 24 compliant)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Choudhury-POS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Choudhury-POS-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Choudhury-POS-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
